# =============================================================================
# nginx reverse proxy / API gateway.
#
# It makes two separate services look like ONE backend on a single origin:
#
#   http://localhost:3008/auth/...            -> auth-service:3009
#   http://localhost:3008/.well-known/...     -> auth-service:3009 (JWKS)
#   http://localhost:3008/api/...             -> ecom-api:3008
#
# Service names (auth-service, ecom-api) resolve over the Docker network — see
# docker/docker-compose.yml. Clients only ever talk to nginx.
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS; lets us use service names and re-resolve if a
  # container restarts with a new IP.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Upstream targets (container port, NOT the host port).
  upstream auth_upstream {
    server auth-service:3009;
  }
  upstream ecom_upstream {
    server ecom-api:3008;
  }

  server {
    # nginx listens on 3008 INSIDE its container; compose publishes it to the
    # host as 3008 as well. This is the single public entry point.
    listen 3008;
    server_name _;

    # Common proxy headers so upstream services see the real client info.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Auth service ---------------------------------------------------------
    # Login/register and everything under /auth/*.
    location /auth/ {
      proxy_pass http://auth_upstream;
    }

    # JWKS (public keys). Exposed through the gateway so external clients can
    # also fetch it; the ecom-api fetches it internally over the Docker network.
    location /.well-known/ {
      proxy_pass http://auth_upstream;
    }

    # --- Ecom API -------------------------------------------------------------
    # Everything under /api/* (products, profile, health).
    location /api/ {
      proxy_pass http://ecom_upstream;
    }

    # --- Gateway health -------------------------------------------------------
    location = /gateway/health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx-gateway"}';
    }
  }
}
